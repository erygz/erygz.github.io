<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 320px;
      text-align: center;
    }

    h1 {
      margin-bottom: 1rem;
      font-size: 2rem;
    }

    .timer {
      font-size: 4rem;
      margin: 1.5rem 0;
      font-weight: bold;
    }

    .status {
      margin-bottom: 1rem;
      font-size: 1rem;
      color: #666;
    }

    .buttons {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1rem;
    }

    button {
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    .start {
      background: #28a745;
      color: white;
    }

    .pause {
      background: #ffc107;
      color: black;
    }

    .reset {
      background: #dc3545;
      color: white;
    }

    .mode-buttons {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .mode-buttons button {
      background: #e9ecef;
      color: #222;
      flex: 1;
    }

    .mode-buttons button.active {
      background: #007bff;
      color: white;
    }

    .custom-time {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
      text-align: left;
    }

    .custom-time label {
      font-size: 0.9rem;
      color: #555;
    }

    .custom-time input {
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pomodoro</h1>

    <div class="status" id="status">Focus Session</div>

    <div class="custom-time">
      <label for="focusMinutes">Focus Minutes</label>
      <input type="number" id="focusMinutes" min="1" max="180" value="20" />
    </div>

    <div class="timer" id="timer">20:00</div>

    <div class="buttons">
      <button class="start" id="startBtn">Start</button>
      <button class="pause" id="pauseBtn">Pause</button>
      <button class="reset" id="resetBtn">Reset</button>
    </div>

    <div class="mode-buttons">
      <button id="focusMode" class="active">Focus</button>
      <button id="shortBreakMode">Short Break</button>
      <button id="longBreakMode">Long Break</button>
    </div>
  </div>

  <script>
    const timerDisplay = document.getElementById('timer');
    const statusDisplay = document.getElementById('status');

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    const focusModeBtn = document.getElementById('focusMode');
    const shortBreakBtn = document.getElementById('shortBreakMode');
    const longBreakBtn = document.getElementById('longBreakMode');
    const focusMinutesInput = document.getElementById('focusMinutes');

    const modes = {
      focus: {
        label: 'Focus Session',
        minutes: 20
      },
      short: {
        label: 'Short Break',
        minutes: 5
      },
      long: {
        label: 'Long Break',
        minutes: 15
      }
    };

    let currentMode = 'focus';
    let timeRemaining = modes[currentMode].minutes * 60;
    let timerInterval = null;
    let isRunning = false;

    function updateDisplay() {
      const minutes = Math.floor(timeRemaining / 60)
        .toString()
        .padStart(2, '0');

      const seconds = (timeRemaining % 60)
        .toString()
        .padStart(2, '0');

      timerDisplay.textContent = `${minutes}:${seconds}`;
    }

    function startTimer() {
      if (isRunning) return;

      isRunning = true;

      timerInterval = setInterval(() => {
        if (timeRemaining > 0) {
          timeRemaining--;
          focusMinutesInput.addEventListener('change', () => {
      if (currentMode === 'focus') {
        resetTimer();
      }
    });

    updateDisplay();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          alert(`${modes[currentMode].label} complete!`);
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      isRunning = false;
    }

    function resetTimer() {
      pauseTimer();

      if (currentMode === 'focus') {
        const customMinutes = parseInt(focusMinutesInput.value, 10);

        if (!isNaN(customMinutes) && customMinutes > 0) {
          modes.focus.minutes = customMinutes;
        }
      }

      timeRemaining = modes[currentMode].minutes * 60;
      updateDisplay();
    }

    function setMode(mode) {
      currentMode = mode;

      focusModeBtn.classList.remove('active');
      shortBreakBtn.classList.remove('active');
      longBreakBtn.classList.remove('active');

      if (mode === 'focus') {
        focusModeBtn.classList.add('active');
      } else if (mode === 'short') {
        shortBreakBtn.classList.add('active');
      } else {
        longBreakBtn.classList.add('active');
      }

      statusDisplay.textContent = modes[mode].label;
      resetTimer();
    }

    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    resetBtn.addEventListener('click', resetTimer);

    focusModeBtn.addEventListener('click', () => setMode('focus'));
    shortBreakBtn.addEventListener('click', () => setMode('short'));
    longBreakBtn.addEventListener('click', () => setMode('long'));

    updateDisplay();
  </script>
</body>
</html>
