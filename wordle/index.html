<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vanilla JS Wordle</title>

  <style>
    :root {
      --bg: #121213;
      --tile: #3a3a3c;
      --border: #565758;
      --text: #ffffff;
      --correct: #538d4e;
      --present: #b59f3b;
      --absent: #3a3a3c;
      --keyboard: #818384;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 0.08em;
    }

    .status {
      min-height: 1.5rem;
      font-size: 1rem;
      text-align: center;
    }

    .board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 0.4rem;
      width: 100%;
      max-width: 350px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.4rem;
    }

    .tile {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 2px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      user-select: none;
      transition: transform 0.15s ease, background 0.2s ease;
      background: transparent;
    }

    .tile.filled {
      border-color: #878a8c;
    }

    .tile.correct {
      background: var(--correct);
      border-color: var(--correct);
    }

    .tile.present {
      background: var(--present);
      border-color: var(--present);
    }

    .tile.absent {
      background: var(--absent);
      border-color: var(--absent);
    }

    .tile.pop {
      transform: scale(1.08);
    }

    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      width: 100%;
      max-width: 500px;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 0.35rem;
    }

    button.key {
      border: none;
      border-radius: 4px;
      background: var(--keyboard);
      color: white;
      font-weight: bold;
      cursor: pointer;
      min-width: 2.5rem;
      height: 3.5rem;
      padding: 0 0.75rem;
      text-transform: uppercase;
      font-size: 0.95rem;
    }

    button.key:hover {
      opacity: 0.9;
    }

    button.key.correct {
      background: var(--correct);
    }

    button.key.present {
      background: var(--present);
    }

    button.key.absent {
      background: var(--absent);
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .restart-btn {
      padding: 0.7rem 1rem;
      border: none;
      border-radius: 6px;
      background: #ffffff;
      color: #111;
      cursor: pointer;
      font-weight: bold;
    }

    .restart-btn:hover {
      opacity: 0.9;
    }

    @media (max-width: 500px) {
      .tile {
        font-size: 1.5rem;
      }

      button.key {
        min-width: 2rem;
        height: 3rem;
        padding: 0 0.45rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>WORDLE</h1>

    <div class="status" id="status" aria-live="polite">
      Guess the 5-letter word!
    </div>

    <section class="board" id="board" aria-label="Wordle game board"></section>

    <section class="keyboard" id="keyboard" aria-label="On-screen keyboard"></section>

    <div class="controls">
      <button class="restart-btn" id="restartBtn">
        New Game
      </button>
    </div>
  </main>

  <script>
    const WORDS = [
      "APPLE", "TRAIN", "PLANT", "STONE", "BRAVE",
      "MOUSE", "LIGHT", "WATER", "CLOUD", "SMILE",
      "GRAPE", "SWEET", "CHAIR", "HEART", "BREAD",
      "WORLD", "FLAME", "SHINE", "DREAM", "GREEN",
      "HOUSE", "BEACH", "PLANE", "TIGER", "CANDY"
    ];

    const ROWS = 6;
    const COLS = 5;

    let secretWord = "";
    let currentRow = 0;
    let currentCol = 0;
    let gameOver = false;

    const guesses = Array.from({ length: ROWS }, () =>
      Array(COLS).fill("")
    );

    const board = document.getElementById("board");
    const keyboard = document.getElementById("keyboard");
    const statusEl = document.getElementById("status");
    const restartBtn = document.getElementById("restartBtn");

    const keyboardLayout = [
      ["Q","W","E","R","T","Y","U","I","O","P"],
      ["A","S","D","F","G","H","J","K","L"],
      ["ENTER","Z","X","C","V","B","N","M","⌫"]
    ];

    function pickWord() {
      return WORDS[Math.floor(Math.random() * WORDS.length)];
    }

    function buildBoard() {
      board.innerHTML = "";

      for (let r = 0; r < ROWS; r++) {
        const row = document.createElement("div");
        row.className = "row";

        for (let c = 0; c < COLS; c++) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile-${r}-${c}`;
          row.appendChild(tile);
        }

        board.appendChild(row);
      }
    }

    function buildKeyboard() {
      keyboard.innerHTML = "";

      keyboardLayout.forEach(keys => {
        const row = document.createElement("div");
        row.className = "keyboard-row";

        keys.forEach(key => {
          const btn = document.createElement("button");
          btn.className = "key";
          btn.textContent = key;
          btn.dataset.key = key;
          btn.setAttribute("aria-label", key);

          btn.addEventListener("click", () => handleKey(key));

          row.appendChild(btn);
        });

        keyboard.appendChild(row);
      });
    }

    function updateBoard() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const tile = document.getElementById(`tile-${r}-${c}`);
          const letter = guesses[r][c];

          tile.textContent = letter;

          if (letter) {
            tile.classList.add("filled");
          } else {
            tile.classList.remove("filled");
          }
        }
      }
    }

    function handleKey(key) {
      if (gameOver) return;

      if (key === "ENTER") {
        submitGuess();
        return;
      }

      if (key === "⌫") {
        deleteLetter();
        return;
      }

      if (/^[A-Z]$/.test(key)) {
        addLetter(key);
      }
    }

    function addLetter(letter) {
      if (currentCol < COLS) {
        guesses[currentRow][currentCol] = letter;

        const tile = document.getElementById(
          `tile-${currentRow}-${currentCol}`
        );

        tile.classList.add("pop");

        setTimeout(() => {
          tile.classList.remove("pop");
        }, 120);

        currentCol++;
        updateBoard();
      }
    }

    function deleteLetter() {
      if (currentCol > 0) {
        currentCol--;
        guesses[currentRow][currentCol] = "";
        updateBoard();
      }
    }

    function submitGuess() {
      if (currentCol < COLS) {
        setStatus("Not enough letters!");
        return;
      }

      const guess = guesses[currentRow].join("");

      evaluateGuess(guess);

      if (guess === secretWord) {
        setStatus("🎉 You guessed it!");
        gameOver = true;
        return;
      }

      currentRow++;
      currentCol = 0;

      if (currentRow >= ROWS) {
        setStatus(`Game over! Word was "${secretWord}"`);
        gameOver = true;
      } else {
        setStatus("");
      }
    }

    function evaluateGuess(guess) {
      const secretLetters = secretWord.split("");

      for (let i = 0; i < COLS; i++) {
        const tile = document.getElementById(
          `tile-${currentRow}-${i}`
        );

        const keyBtn = document.querySelector(
          `[data-key="${guess[i]}"]`
        );

        let state = "absent";

        if (guess[i] === secretWord[i]) {
          state = "correct";
        } else if (secretLetters.includes(guess[i])) {
          state = "present";
        }

        tile.classList.add(state);

        if (keyBtn) {
          if (
            !keyBtn.classList.contains("correct") &&
            !(keyBtn.classList.contains("present") && state === "absent")
          ) {
            keyBtn.classList.remove("correct", "present", "absent");
            keyBtn.classList.add(state);
          }
        }
      }
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function startGame() {
      secretWord = pickWord();
      currentRow = 0;
      currentCol = 0;
      gameOver = false;

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          guesses[r][c] = "";
        }
      }

      buildBoard();
      buildKeyboard();

      setStatus("Guess the 5-letter word!");

      console.log("Secret Word:", secretWord);
    }

    document.addEventListener("keydown", (e) => {
      let key = e.key.toUpperCase();

      if (key === "BACKSPACE") {
        key = "⌫";
      }

      handleKey(key);
    });

    restartBtn.addEventListener("click", startGame);

    startGame();
  </script>
</body>
</html>
